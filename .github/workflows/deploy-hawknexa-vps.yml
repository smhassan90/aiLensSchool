name: Deploy HawkNexa VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'portal/**'
      - 'deploy/hawknexa/**'
      - '.github/workflows/deploy-hawknexa-vps.yml'
  workflow_dispatch:

concurrency:
  group: hawknexa-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check required secrets
        env:
          HAWKNEXA_DEPLOY_WEBHOOK_SECRET: ${{ secrets.HAWKNEXA_DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -z "$HAWKNEXA_DEPLOY_WEBHOOK_SECRET" ]; then
            echo "::error::Missing repository secret: HAWKNEXA_DEPLOY_WEBHOOK_SECRET"
            exit 1
          fi

      - name: Trigger deploy on VPS
        env:
          DEPLOY_URL: ${{ vars.HAWKNEXA_DEPLOY_URL || 'https://hawknexabackend.fynals.com/internal/deploy' }}
          DEPLOY_SECRET: ${{ secrets.HAWKNEXA_DEPLOY_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          echo "POST ${DEPLOY_URL}"
          http_code=$(curl -sS -o deploy-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${DEPLOY_SECRET}" \
            --max-time 1800 \
            "${DEPLOY_URL}")
          echo "HTTP ${http_code}"
          cat deploy-response.txt
          if [ "${http_code}" -ge 200 ] && [ "${http_code}" -lt 300 ]; then
            exit 0
          fi
          exit 1
