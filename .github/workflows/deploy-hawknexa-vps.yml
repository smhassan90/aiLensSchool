name: Deploy HawkNexa VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'portal/**'
      - 'deploy/hawknexa/**'
      - '.github/workflows/deploy-hawknexa-vps.yml'
  workflow_dispatch:

concurrency:
  group: hawknexa-vps-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
            portal:
              - 'portal/**'

      - name: Check required secrets
        env:
          SECRET_PRIMARY: ${{ secrets.HAWKNEXA_DEPLOY_WEBHOOK_SECRET }}
          SECRET_ALIAS: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
        run: |
          if [ -n "$SECRET_PRIMARY" ]; then
            echo "DEPLOY_SECRET=$SECRET_PRIMARY" >> "$GITHUB_ENV"
          elif [ -n "$SECRET_ALIAS" ]; then
            echo "DEPLOY_SECRET=$SECRET_ALIAS" >> "$GITHUB_ENV"
          else
            echo "::error::Missing repository secret. Add one named HAWKNEXA_DEPLOY_WEBHOOK_SECRET (or DEPLOY_WEBHOOK_SECRET) in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Check deploy webhook
        env:
          WEBHOOK_HEALTH_URL: ${{ vars.HAWKNEXA_WEBHOOK_HEALTH_URL || 'https://hawknexabackend.fynals.com/internal/deploy/health' }}
        run: |
          set -euo pipefail
          echo "GET ${WEBHOOK_HEALTH_URL}"
          webhook_code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 20 "${WEBHOOK_HEALTH_URL}" || echo "000")
          echo "Webhook health HTTP ${webhook_code}"
          if [ "${webhook_code}" != "200" ]; then
            echo "::error::Deploy webhook is not healthy (HTTP ${webhook_code})."
            if [ "${webhook_code}" = "000" ]; then
              echo "HTTP 000 = VPS ports 80/443 are not reachable (Caddy down or firewall blocking)."
            fi
            echo "On the VPS (Hostinger browser terminal) run:"
            echo "  bash /opt/apps/hawknexa/deploy/recover-vps.sh"
            echo "Or: bash /opt/apps/hawknexa/deploy/recover-deploy-webhook.sh"
            exit 1
          fi

      - name: Trigger deploy on VPS
        env:
          DEPLOY_URL: ${{ vars.HAWKNEXA_DEPLOY_URL || 'https://hawknexabackend.fynals.com/internal/deploy' }}
          DEPLOY_SECRET: ${{ env.DEPLOY_SECRET }}
          BUILD_BACKEND: ${{ steps.changes.outputs.backend }}
          BUILD_PORTAL: ${{ steps.changes.outputs.portal }}
        run: |
          set -euo pipefail
          TARGETS=""
          if [ "${BUILD_BACKEND}" = "true" ]; then TARGETS="backend"; fi
          if [ "${BUILD_PORTAL}" = "true" ]; then
            if [ -n "${TARGETS}" ]; then TARGETS="${TARGETS},portal"; else TARGETS="portal"; fi
          fi
          BODY="{}"
          if [ -n "${TARGETS}" ]; then
            BODY="{\"targets\":\"${TARGETS}\"}"
            echo "Deploy targets: ${TARGETS}"
          else
            echo "No backend/portal file changes in this push; VPS will skip image rebuild if unchanged."
          fi
          echo "POST ${DEPLOY_URL}"
          http_code=$(curl -sS -o deploy-response.txt -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${DEPLOY_SECRET}" \
            -H "Content-Type: application/json" \
            -d "${BODY}" \
            --max-time 60 \
            "${DEPLOY_URL}")
          echo "HTTP ${http_code}"
          cat deploy-response.txt
          if [ "${http_code}" = "502" ] || [ "${http_code}" = "503" ]; then
            echo "::error::Deploy webhook returned ${http_code}."
            exit 1
          fi
          if [ "${http_code}" != "202" ] && [ "${http_code}" != "200" ]; then
            exit 1
          fi

      - name: Wait for VPS deploy to finish
        env:
          STATUS_URL: ${{ vars.HAWKNEXA_DEPLOY_STATUS_URL || 'https://hawknexabackend.fynals.com/internal/deploy/status' }}
          HEALTH_URL: ${{ vars.HAWKNEXA_HEALTH_URL || 'https://hawknexabackend.fynals.com/api/v1/health' }}
          DEPLOY_SECRET: ${{ env.DEPLOY_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
          BUILD_BACKEND: ${{ steps.changes.outputs.backend }}
        run: |
          set -euo pipefail
          short_sha="$(echo "${EXPECTED_SHA}" | cut -c1-7)"
          echo "Waiting for VPS deploy (commit ${short_sha})..."
          for i in $(seq 1 72); do
            status_body="$(curl -fsS -H "Authorization: Bearer ${DEPLOY_SECRET}" "${STATUS_URL}" 2>/dev/null || true)"
            if [ -n "${status_body}" ]; then
              echo "${status_body}"
              if echo "${status_body}" | grep -q '"status":"success"' \
                && echo "${status_body}" | grep -q "\"commit\":\"${short_sha}\""; then
                echo "OK: deploy status success for ${short_sha}"
                exit 0
              fi
              if echo "${status_body}" | grep -q '"status":"failed"'; then
                echo "::error::VPS deploy failed. Check /tmp/hawknexa-deploy.log on the server."
                exit 1
              fi
            fi

            if [ "${BUILD_BACKEND}" = "true" ]; then
              health_body="$(curl -fsS "${HEALTH_URL}" 2>/dev/null || true)"
              if [ -n "${health_body}" ] && echo "${health_body}" | grep -q "\"commit\":\"${short_sha}\""; then
                echo "OK: API health reports ${short_sha}"
                exit 0
              fi
            fi

            echo "Waiting for deploy... (${i}/72)"
            sleep 5
          done
          echo "::error::Deploy did not complete within 6 minutes."
          exit 1
