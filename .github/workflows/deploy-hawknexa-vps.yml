name: Deploy HawkNexa VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'portal/**'
      - 'deploy/hawknexa/**'
      - '.github/workflows/deploy-hawknexa-vps.yml'
  workflow_dispatch:

concurrency:
  group: hawknexa-vps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Ubuntu VPS
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Check required secrets
        env:
          HAWKNEXA_VPS_HOST: ${{ secrets.HAWKNEXA_VPS_HOST }}
          HAWKNEXA_VPS_USER: ${{ secrets.HAWKNEXA_VPS_USER }}
          HAWKNEXA_VPS_SSH_KEY: ${{ secrets.HAWKNEXA_VPS_SSH_KEY }}
        run: |
          missing=0
          [ -n "$HAWKNEXA_VPS_HOST" ] || { echo "::error::Missing repository secret: HAWKNEXA_VPS_HOST"; missing=1; }
          [ -n "$HAWKNEXA_VPS_USER" ] || { echo "::error::Missing repository secret: HAWKNEXA_VPS_USER"; missing=1; }
          [ -n "$HAWKNEXA_VPS_SSH_KEY" ] || { echo "::error::Missing repository secret: HAWKNEXA_VPS_SSH_KEY"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HAWKNEXA_VPS_HOST }}
          username: ${{ secrets.HAWKNEXA_VPS_USER }}
          key: ${{ secrets.HAWKNEXA_VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            bash /opt/apps/hawknexa/deploy/deploy.sh
