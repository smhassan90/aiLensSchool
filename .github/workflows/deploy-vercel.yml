name: Deploy to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      app:
        description: Which app to deploy
        type: choice
        options: [all, portal, backend]
        default: all

concurrency:
  group: vercel-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.set.outputs.portal }}
      backend: ${{ steps.set.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            portal:
              - 'portal/**'
              - '.github/workflows/deploy-vercel.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/deploy-vercel.yml'
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            APP="${{ github.event.inputs.app }}"
            if [ "$APP" = "all" ] || [ "$APP" = "portal" ]; then echo "portal=true" >> "$GITHUB_OUTPUT"; else echo "portal=false" >> "$GITHUB_OUTPUT"; fi
            if [ "$APP" = "all" ] || [ "$APP" = "backend" ]; then echo "backend=true" >> "$GITHUB_OUTPUT"; else echo "backend=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "portal=${{ steps.filter.outputs.portal }}" >> "$GITHUB_OUTPUT"
            echo "backend=${{ steps.filter.outputs.backend }}" >> "$GITHUB_OUTPUT"
          fi

  deploy-portal:
    name: Deploy portal
    needs: changes
    if: needs.changes.outputs.portal == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PORTAL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        working-directory: portal
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Treat portal/ as the Vercel project root
        working-directory: portal
        run: |
          node -e "
            const fs = require('fs');
            const file = '.vercel/project.json';
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.settings = json.settings || {};
            delete json.settings.rootDirectory;
            fs.writeFileSync(file, JSON.stringify(json, null, 2));
          "
          node -e "const p=require('./package.json'); if (!p.dependencies?.next && !p.devDependencies?.next) { console.error('next is missing from portal/package.json'); process.exit(1); } console.log('next', p.dependencies.next);"
      - name: Deploy
        working-directory: portal
        run: vercel deploy --yes ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

  deploy-backend:
    name: Deploy backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        working-directory: backend
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}
      - name: Treat backend/ as the Vercel project root
        working-directory: backend
        run: |
          node -e "
            const fs = require('fs');
            const file = '.vercel/project.json';
            const json = JSON.parse(fs.readFileSync(file, 'utf8'));
            json.settings = json.settings || {};
            delete json.settings.rootDirectory;
            fs.writeFileSync(file, JSON.stringify(json, null, 2));
          "
      - name: Deploy
        working-directory: backend
        run: vercel deploy --yes ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
